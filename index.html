<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090D">
<title>Are you really still there?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --void:#08090D; --navy:#0e1428; --navy-2:#141b38; --violet:#4a3a6e; --violet-soft:#6b5a94;
  --silver:#c9cfdd; --text:#eceaf2; --text-dim:rgba(236,234,242,.55);
  --serif:'Cormorant Garamond','Playfair Display',Georgia,serif;
  --sans:'Inter',system-ui,sans-serif;
  --slow:2.8s cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--void);color:var(--text);overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased}

/* ---------- atmosphere ---------- */
.sky{position:fixed;inset:0;background:
  radial-gradient(120% 80% at 50% 110%,var(--navy-2) 0%,transparent 60%),
  radial-gradient(80% 60% at 20% 0%,rgba(74,58,110,.28) 0%,transparent 60%),
  linear-gradient(180deg,#05060a 0%,var(--void) 40%,var(--navy) 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.fog{position:fixed;inset:-20%;pointer-events:none;opacity:.55;will-change:transform;
  background:radial-gradient(40% 30% at 30% 70%,rgba(107,90,148,.16),transparent 70%),
             radial-gradient(35% 25% at 75% 60%,rgba(60,80,150,.14),transparent 70%)}
.fog.f1{animation:drift 70s ease-in-out infinite alternate}
.fog.f2{opacity:.4;animation:drift 95s ease-in-out infinite alternate-reverse;transform:scaleX(-1)}
@keyframes drift{from{transform:translate3d(-4%,2%,0) scale(1)}to{transform:translate3d(5%,-3%,0) scale(1.15)}}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(4,5,8,.75) 100%)}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:screen;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ---------- stage ---------- */
main{position:fixed;inset:0;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 28px max(24px,env(safe-area-inset-bottom));text-align:center}
.stack{display:flex;flex-direction:column;align-items:center;max-width:46rem;transition:transform var(--slow)}
body.revealed .stack{transform:translateY(-3vh)}

h1{font-family:var(--serif);font-weight:300;font-size:clamp(2.1rem,7.2vw,4.6rem);line-height:1.15;letter-spacing:.01em;
  color:var(--text);text-shadow:0 0 40px rgba(150,140,210,.25);
  opacity:0;filter:blur(10px);animation:emerge 4.5s 1.6s var(--ease,ease) forwards;transition:opacity var(--slow),filter var(--slow)}
h1 em{font-style:italic;color:var(--silver)}
.whisper{margin-top:1.6rem;font:300 .78rem/1 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--text-dim);
  opacity:0;animation:emerge 3.5s 5s ease forwards}
@keyframes emerge{to{opacity:1;filter:blur(0)}}
body.revealed h1{opacity:.28!important;filter:blur(1.5px)!important;animation:none}
body.revealed .whisper{opacity:0!important;animation:none;transition:opacity 2s}

.perhaps{margin-top:3.2rem;background:none;border:0;cursor:pointer;color:var(--silver);
  font:italic 300 1.35rem var(--serif);letter-spacing:.08em;padding:.9rem 1.6rem;position:relative;
  opacity:0;animation:emerge 3s 8.5s ease forwards;transition:opacity 2.2s,transform 2.2s}
.perhaps::after{content:"";position:absolute;left:50%;bottom:.35rem;width:0;height:1px;background:linear-gradient(90deg,transparent,var(--silver),transparent);
  transform:translateX(-50%);transition:width .9s ease}
.perhaps:hover::after,.perhaps:focus-visible::after{width:70%}
.perhaps:focus-visible{outline:1px solid var(--violet-soft);outline-offset:4px;border-radius:2px}
body.revealed .perhaps{opacity:0!important;animation:none;pointer-events:none;transform:translateY(8px)}

.message{position:absolute;left:50%;top:50%;width:min(34rem,86vw);transform:translate(-50%,-50%);pointer-events:none}
.message p{font:italic 300 clamp(1.5rem,4.6vw,2.4rem)/1.5 var(--serif);color:var(--text);
  opacity:0;filter:blur(12px);letter-spacing:.02em;text-shadow:0 0 30px rgba(170,160,230,.3);
  transition:opacity 5s 1.2s ease,filter 5s 1.2s ease}
body.revealed .message p{opacity:1;filter:blur(0)}
.message small{display:block;margin-top:1.6rem;font:300 .72rem var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--text-dim);
  opacity:0;transition:opacity 4s 0s ease}
.message small.on{opacity:1;transition-delay:.2s}

/* ---------- glowing light ---------- */
.light{position:fixed;right:clamp(28px,9vw,120px);bottom:clamp(60px,16vh,170px);width:44px;height:44px;border:0;background:none;cursor:pointer;
  opacity:0;animation:emerge 4s 11s ease forwards;border-radius:50%}
.light i{position:absolute;inset:16px;border-radius:50%;background:#dfe3f5;
  box-shadow:0 0 12px 3px rgba(190,200,255,.7),0 0 40px 12px rgba(120,110,200,.35);animation:breathe 5s ease-in-out infinite;transition:transform .8s,box-shadow .8s}
.light:hover i,.light:focus-visible i{transform:scale(1.5)}
.light:focus-visible{outline:1px solid var(--violet-soft);outline-offset:2px}
.light.lit i{box-shadow:0 0 18px 6px rgba(220,225,255,.95),0 0 90px 36px rgba(130,115,220,.5);transform:scale(1.8)}
.light b{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(200,205,240,.5);opacity:0;pointer-events:none}
.light.ping b{animation:ping 2.6s ease-out}
@keyframes ping{from{opacity:.8;transform:scale(.4)}to{opacity:0;transform:scale(9)}}
@keyframes breathe{50%{opacity:.45}}

/* ---------- sound ---------- */
.sound{position:fixed;left:max(20px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));background:none;border:0;cursor:pointer;
  color:var(--text-dim);font:300 .68rem var(--sans);letter-spacing:.28em;text-transform:uppercase;display:flex;align-items:center;gap:.8rem;padding:.7rem;
  opacity:0;animation:emerge 3s 6s ease forwards;transition:color .6s}
.sound:hover,.sound:focus-visible{color:var(--text)}
.sound:focus-visible{outline:1px solid var(--violet-soft);border-radius:2px}
.sound .bars{display:flex;gap:2px;align-items:center;height:12px}
.sound .bars span{width:1.5px;height:3px;background:currentColor;transition:height .4s}
.sound[aria-pressed="true"] .bars span{animation:eq 1.8s ease-in-out infinite}
.sound[aria-pressed="true"] .bars span:nth-child(2){animation-delay:.3s}
.sound[aria-pressed="true"] .bars span:nth-child(3){animation-delay:.6s}
@keyframes eq{50%{height:12px}}

@media (prefers-reduced-motion:reduce){
  .fog{animation:none}
  h1,.whisper,.perhaps,.light,.sound{animation-duration:.01s;animation-delay:0s}
}
</style>
</head>
<body>
<div class="sky"></div>
<div class="fog f1"></div><div class="fog f2"></div>
<canvas id="space" aria-hidden="true"></canvas>
<div class="vignette"></div><div class="grain"></div>

<main>
  <div class="stack">
    <h1>SO, you still visiting the website!</h1>
    <p class="whisper">It’s been a while…</p>
    <p class="whisper">You still remember me.</p>
    <button class="perhaps" id="perhaps" type="button"><em>Perhaps…</em></button>
  </div>
  <div class="message" id="message" aria-live="polite">
    <p>Do It</p>
    <small id="echo"></small>
  </div>
</main>

<button class="light" id="light" type="button" aria-label="A small light"><b></b><i></i></button>
<button class="sound" id="sound" type="button" aria-pressed="false"><span class="bars"><span></span><span></span><span></span></span><span id="soundLabel">Sound off</span></button>

<script>
(() => {
  'use strict';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('space'), ctx = cv.getContext('2d');
  let W, H, dpr, stars = [], dust = [];
  const mouse = {x:0, y:0, tx:0, ty:0, px:-999, py:-999};
  let boost = 0, last = 0, running = true;

  function resize(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(Math.min(260, W*H/6500));
    stars = Array.from({length:n}, () => {
      const z = Math.random();                       // depth 0 (far) … 1 (near)
      return {x:Math.random()*W, y:Math.random()*H, z, r:.25+z*1.15,
              a:.25+Math.random()*.6, tw:Math.random()*6.28, ts:.4+Math.random()*1.2,
              hue:Math.random()<.2 ? 255 : 220};
    });
    dust = Array.from({length:Math.round(n/6)}, () => ({
      x:Math.random()*W, y:Math.random()*H, r:.6+Math.random()*1.6,
      vx:(Math.random()-.5)*.08, vy:-.03-Math.random()*.1, a:.05+Math.random()*.14, p:Math.random()*6.28}));
  }

  function frame(t){
    if(!running){ return; }
    const dt = Math.min((t-last)/16.7, 3) || 1; last = t;
    mouse.x += (mouse.tx-mouse.x)*.04; mouse.y += (mouse.ty-mouse.y)*.04;
    boost *= .985;
    ctx.clearRect(0,0,W,H);

    for(const s of stars){
      s.x -= (.015+s.z*.07)*dt*(reduce?0:1);         // slow drift
      if(s.x < -2) s.x = W+2;
      const ox = mouse.x*s.z*22, oy = mouse.y*s.z*14; // parallax
      const x = s.x+ox, y = s.y+oy;
      const tw = .65+.35*Math.sin(t*.001*s.ts+s.tw);
      const d = Math.hypot(x-mouse.px, y-mouse.py);
      const near = d<130 ? (1-d/130) : 0;             // stars react to cursor
      const a = Math.min(1, s.a*tw + near*.7 + boost*.35*s.z);
      const r = s.r*(1+near*.9+boost*.4);
      ctx.beginPath(); ctx.arc(x,y,r,0,6.283);
      ctx.fillStyle = `hsla(${s.hue},40%,${86+near*10}%,${a})`;
      if(r>1.1 || near>.3){ ctx.shadowColor='rgba(170,175,255,.8)'; ctx.shadowBlur=6+near*10; } else ctx.shadowBlur=0;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    for(const p of dust){
      p.x += p.vx*dt + Math.sin(t*.0004+p.p)*.05; p.y += p.vy*dt;
      if(p.y<-6){ p.y=H+6; p.x=Math.random()*W; }
      const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);
      g.addColorStop(0,`rgba(190,185,240,${p.a+boost*.1})`); g.addColorStop(1,'rgba(190,185,240,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*4,0,6.283); ctx.fill();
    }
    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  addEventListener('pointermove', e => {
    mouse.tx = e.clientX/W-.5; mouse.ty = e.clientY/H-.5; mouse.px = e.clientX; mouse.py = e.clientY;
  }, {passive:true});
  addEventListener('pointerleave', () => { mouse.px = mouse.py = -999; });
  document.addEventListener('visibilitychange', () => {
    running = !document.hidden; if(running){ last = performance.now(); requestAnimationFrame(frame); }
  });
  resize(); requestAnimationFrame(frame);

  /* ---------- interaction ---------- */
  const body = document.body, light = document.getElementById('light'), echo = document.getElementById('echo');
  document.getElementById('perhaps').addEventListener('click', () => { body.classList.add('revealed'); boost = 1; });

  const whispers = ['Some places wait quietly.', 'The light stayed on.', 'No rush. Really.'];
  let wi = 0;
  light.addEventListener('click', () => {
    light.classList.add('lit','ping'); boost = 1.6;
    setTimeout(() => light.classList.remove('ping'), 2700);
    setTimeout(() => light.classList.remove('lit'), 3200);
    if(body.classList.contains('revealed')){
      echo.classList.remove('on');
      setTimeout(() => { echo.textContent = whispers[wi++ % whispers.length]; echo.classList.add('on'); }, 900);
    }
  });

  /* ---------- ambient sound (off by default, never autoplays) ---------- */
  const btn = document.getElementById('sound'), label = document.getElementById('soundLabel');
  let ac, master, started = false;
  function build(){
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520; lp.Q.value = .4;
    const lfo = ac.createOscillator(), lfoG = ac.createGain(); lfo.frequency.value = .06; lfoG.gain.value = 180;
    lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
    [110, 164.81, 220, 277.18, 329.63].forEach((f,i) => {            // A minor-ish open pad
      [-4, 4].forEach(det => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = i%2 ? 'triangle' : 'sine'; o.frequency.value = f; o.detune.value = det;
        g.gain.value = .05/(i+1.4); o.connect(g); g.connect(lp); o.start();
      });
    });
    lp.connect(master); master.connect(ac.destination); started = true;
  }
  btn.addEventListener('click', async () => {
    const on = btn.getAttribute('aria-pressed') === 'true';
    if(!started) build();
    if(!on){ await ac.resume(); master.gain.cancelScheduledValues(ac.currentTime); master.gain.linearRampToValueAtTime(.55, ac.currentTime+4); }
    else { master.gain.cancelScheduledValues(ac.currentTime); master.gain.linearRampToValueAtTime(0, ac.currentTime+1.5); setTimeout(() => ac.suspend(), 1700); }
    btn.setAttribute('aria-pressed', String(!on)); label.textContent = on ? 'Sound off' : 'Sound on';
  });
})();
</script>
</body>
</html>
